name: Lab notes

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query{user(login:"conkouroudevs"){contributionsCollection{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}' \
            --jq '{days:[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]|[.date,.contributionCount]]}' > design/contributions.json
      - run: python design/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/contributions.json assets
          git diff --cached --quiet || (git commit -m "Update lab notes" && git push)
